<!DOCTYPE html>
<html>
<head>
  <title>密钥生成器</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 20px;
    }
    h1 {
      color: #333;
    }
    p {
      color: #666;
    }
    label {
      display: inline-block;
      width: 120px;
      text-align: right;
      margin-right: 10px;
      color: #333;
    }
    input[type="text"] {
      width: 300px;
      padding: 8px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #45a049;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <h1>生成安全密钥</h1>
  <p>点击下面的按钮生成应用程序所需的安全随机字符串。</p>
  <p>请将这些字符串安全地保存，并在你的 .env 文件中使用它们。</p>
  
  <div class="container">
    <label for="jwt-secret">JWT_SECRET:</label>
    <input type="text" id="jwt-secret" readonly><br>
    <div class="button-group">
      <button onclick="generateJWTSecret()">生成 JWT 密钥</button>
      <button onclick="copyToClipboard('jwt-secret')">复制 JWT 密钥</button>
    </div>
    
    <label for="crypto-secret">CRYPTO_SECRET:</label>
    <input type="text" id="crypto-secret" readonly><br>
    <div class="button-group">
      <button onclick="generateCryptoSecret()">生成加密密钥</button>
      <button onclick="copyToClipboard('crypto-secret')">复制加密密钥</button>
    </div>

    <label for="session-secret">SESSION_SECRET:</label>
    <input type="text" id="session-secret" readonly><br>
    <div class="button-group">
      <button onclick="generateSessionSecret()">生成会话密钥</button>
      <button onclick="copyToClipboard('session-secret')">复制会话密钥</button>
    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
