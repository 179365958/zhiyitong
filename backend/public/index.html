<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智易通财务管理系统</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f7fa;
            color: #2c3e50;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0,0,0,0.1);
            min-width: 400px;
        }
        h1 {
            margin-bottom: 1rem;
            color: #409eff;
        }
        p {
            margin: 0.5rem 0;
            color: #606266;
        }
        .link {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            background-color: #409eff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        .link:hover {
            background-color: #66b1ff;
        }
        .status {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #ebeef5;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            margin: 0.5rem 0;
            padding: 0.5rem;
            background-color: #f5f7fa;
            border-radius: 4px;
        }
        .status-label {
            color: #606266;
            font-weight: 500;
        }
        .status-value {
            color: #67c23a;
        }
        .status-value.error {
            color: #f56c6c;
        }
        .status-value.warning {
            color: #e6a23c;
        }
        .refresh-button {
            background: none;
            border: none;
            color: #409eff;
            cursor: pointer;
            padding: 0;
            font-size: 0.9rem;
            margin-left: 0.5rem;
        }
        .refresh-button:hover {
            color: #66b1ff;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .refresh-button.loading {
            animation: spin 1s linear infinite;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>智易通财务管理系统</h1>
        <p>欢迎使用智易通财务管理系统</p>
        <p>一个专为小微企业设计的智能财务管理解决方案</p>
        <a href="http://localhost:5173/init" class="link">开始使用</a>

        <div class="status">
            <h2>
                系统状态
                <button onclick="refreshStatus()" class="refresh-button" id="refreshButton">⟳</button>
            </h2>
            <div id="statusMessage"></div>
        </div>
    </div>

    <script>
        function formatUptime(seconds) {
            const days = Math.floor(seconds / 86400);
            const hours = Math.floor((seconds % 86400) / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const remainingSeconds = Math.floor(seconds % 60);

            const parts = [];
            if (days > 0) parts.push(`${days}天`);
            if (hours > 0) parts.push(`${hours}小时`);
            if (minutes > 0) parts.push(`${minutes}分钟`);
            if (remainingSeconds > 0 || parts.length === 0) parts.push(`${remainingSeconds}秒`);

            return parts.join(' ');
        }

        function refreshStatus() {
            fetch('/api/system/status')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('网络响应不正常');
                    }
                    return response.json();
                })
                .then(result => {
                    if (result.success) {
                        const status = result.status;
                        document.getElementById('statusMessage').innerText = `数据库: ${status.database}, 大小: ${status.size}MB, 在线时间: ${formatUptime(status.uptime)}`;
                    } else {
                        document.getElementById('statusMessage').innerText = '状态未知';
                    }
                })
                .catch(error => {
                    console.error('请求失败:', error);
                    document.getElementById('statusMessage').innerText = '无法获取状态';
                });
        }

        // 初始加载
        refreshStatus();

        // 每30秒自动刷新一次
        setInterval(refreshStatus, 30000);
    </script>
</body>
</html>
